<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Visitor Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* --- Top Bar --- */
    .topbar {
      background: #1a1a2e;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a4a;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar h1 { font-size: 20px; color: #667eea; }
    .topbar-actions { display: flex; gap: 12px; }
    .topbar-actions button, .topbar-actions a {
      background: #2a2a4a; color: #ccc; border: 1px solid #3a3a5a;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .topbar-actions button:hover, .topbar-actions a:hover {
      background: #3a3a6a; color: #fff;
    }

    /* --- Stats Cards --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }
    .stat-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }

    /* --- Sections --- */
    .dashboard { padding: 0 32px 32px; }
    .section {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- Charts Row --- */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-list { padding: 16px 20px; }
    .chart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1f1f3a;
    }
    .chart-item:last-child { border-bottom: none; }
    .chart-item .name { font-size: 14px; }
    .chart-item .count {
      background: #2a2a4a; color: #667eea;
      padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600;
    }
    .bar-bg {
      flex: 1;
      height: 6px;
      background: #2a2a4a;
      border-radius: 3px;
      margin: 0 12px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* --- Table --- */
    .search-bar {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a4a;
      display: flex; gap: 12px; align-items: center;
    }
    .search-bar input {
      flex: 1; background: #0f0f23; border: 1px solid #3a3a5a; color: #e0e0e0;
      padding: 10px 16px; border-radius: 8px; font-size: 14px; outline: none;
    }
    .search-bar input:focus { border-color: #667eea; }
    .search-bar button {
      background: #667eea; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px;
    }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #12122a; }
    th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      color: #888;
      white-space: nowrap;
      position: sticky; top: 0;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a30;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr:hover td { background: #1f1f3a; }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-mobile { background: #2d1f3d; color: #b47ede; }
    .badge-desktop { background: #1f2d3d; color: #7eb4de; }
    .badge-tablet { background: #1f3d2d; color: #7ede9e; }

    .delete-btn {
      background: none; border: none; color: #e74c3c;
      cursor: pointer; font-size: 16px; padding: 4px;
      opacity: 0.6; transition: opacity 0.2s;
    }
    .delete-btn:hover { opacity: 1; }

    /* --- Pagination --- */
    .pagination {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #2a2a4a;
    }
    .pagination button {
      background: #2a2a4a; color: #ccc; border: 1px solid #3a3a5a;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pagination button:not(:disabled):hover { background: #3a3a6a; }
    .page-info { color: #888; font-size: 13px; }

    /* --- Detail Modal --- */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 200;
      justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1a2e; border: 1px solid #3a3a5a; border-radius: 16px;
      padding: 32px; max-width: 700px; width: 90%; max-height: 85vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 20px; margin-bottom: 20px; color: #667eea; }
    .modal-close {
      float: right; background: none; border: none; color: #888;
      font-size: 24px; cursor: pointer;
    }
    .modal-close:hover { color: #fff; }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .detail-item {
      padding: 12px; background: #12122a; border-radius: 8px;
    }
    .detail-item .label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .detail-item .value { font-size: 14px; color: #e0e0e0; word-break: break-all; }

    /* --- Loading --- */
    .loading { text-align: center; padding: 40px; color: #666; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid #2a2a4a; border-top-color: #667eea;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <h1>📊 Visitor Tracker Dashboard</h1>
    <div class="topbar-actions">
      <button onclick="loadDashboard()">🔄 Refresh</button>
      <a href="/api/export">📥 Export CSV</a>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="number" id="statTotal">-</div>
      <div class="label">Total Visitors</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statUnique">-</div>
      <div class="label">Unique IPs</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statToday">-</div>
      <div class="label">Today</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statCountries">-</div>
      <div class="label">Countries</div>
    </div>
  </div>

  <div class="dashboard">
    <!-- Charts Row -->
    <div class="charts-grid">
      <div class="section">
        <div class="section-header">🌍 Top Countries</div>
        <div class="chart-list" id="chartCountries"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="section">
        <div class="section-header">🏙️ Top Cities</div>
        <div class="chart-list" id="chartCities"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="section">
        <div class="section-header">🌐 Browsers</div>
        <div class="chart-list" id="chartBrowsers"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="section">
        <div class="section-header">💻 Operating Systems</div>
        <div class="chart-list" id="chartOS"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>

    <!-- Visitor Table -->
    <div class="section">
      <div class="section-header">
        <span>👥 All Visitors</span>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by IP, city, country, browser, OS, ISP..."
               onkeydown="if(event.key==='Enter') searchVisitors()">
        <button onclick="searchVisitors()">Search</button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>IP</th>
              <th>Location</th>
              <th>Browser</th>
              <th>OS</th>
              <th>Device</th>
              <th>Screen</th>
              <th>ISP</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="visitorTable">
            <tr><td colspan="10" class="loading"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" disabled>← Previous</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button id="nextBtn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Visitor Details</h2>
      <div class="detail-grid" id="detailContent"></div>
    </div>
  </div>

  <script>
    let currentPage = 1;
    let currentSearch = '';

    // --- Get auth header ---
    function getAuth() {
      // Reuse the Basic Auth credentials already provided via browser prompt
      return {};  // Browser sends auth headers automatically after initial prompt
    }

    // --- Load stats ---
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.status === 401) return;
        const stats = await res.json();

        document.getElementById('statTotal').textContent = stats.totalVisitors.toLocaleString();
        document.getElementById('statUnique').textContent = stats.uniqueIPs.toLocaleString();
        document.getElementById('statToday').textContent = stats.todayVisitors.toLocaleString();
        document.getElementById('statCountries').textContent = stats.topCountries.length;

        renderChart('chartCountries', stats.topCountries, v => `${v.country_code || '🌍'} ${v.country}`);
        renderChart('chartCities', stats.topCities, v => `${v.country_code || '📍'} ${v.city}`);
        renderChart('chartBrowsers', stats.topBrowsers, v => v.browser);
        renderChart('chartOS', stats.topOS, v => v.os);
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    // --- Render chart ---
    function renderChart(containerId, items, nameGetter) {
      const container = document.getElementById(containerId);
      if (!items || items.length === 0) {
        container.innerHTML = '<div style="padding:20px;color:#666;text-align:center">No data yet</div>';
        return;
      }
      const maxCount = Math.max(...items.map(i => i.count));
      container.innerHTML = items.map(item => `
        <div class="chart-item">
          <span class="name">${nameGetter(item)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(item.count/maxCount*100)}%"></div></div>
          <span class="count">${item.count}</span>
        </div>
      `).join('');
    }

    // --- Load visitors ---
    async function loadVisitors() {
      try {
        const res = await fetch(`/api/visitors?page=${currentPage}&limit=50&search=${encodeURIComponent(currentSearch)}`);
        if (res.status === 401) return;
        const data = await res.json();

        const tbody = document.getElementById('visitorTable');
        if (data.visitors.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:#666">No visitors found</td></tr>';
        } else {
          tbody.innerHTML = data.visitors.map(v => `
            <tr onclick="showDetail(${v.id})" style="cursor:pointer">
              <td>${v.id}</td>
              <td>${formatTime(v.visited_at)}</td>
              <td><code style="color:#667eea">${v.ip}</code></td>
              <td>${v.city || '?'}, ${v.country_code || '??'}</td>
              <td>${v.browser || '?'} ${v.browser_version ? v.browser_version.split('.')[0] : ''}</td>
              <td>${v.os || '?'}</td>
              <td><span class="badge badge-${(v.device_type||'desktop').toLowerCase()}">${v.device_type || 'desktop'}</span></td>
              <td>${v.screen_width || '?'}×${v.screen_height || '?'}</td>
              <td title="${v.isp || ''}">${(v.isp || '?').substring(0, 20)}</td>
              <td>
                <button class="delete-btn" onclick="event.stopPropagation();deleteVisitor(${v.id})" title="Delete">🗑️</button>
              </td>
            </tr>
          `).join('');
        }

        document.getElementById('pageInfo').textContent = `Page ${data.page} of ${data.pages} (${data.total} total)`;
        document.getElementById('prevBtn').disabled = data.page <= 1;
        document.getElementById('nextBtn').disabled = data.page >= data.pages;

        // Store visitor data for detail modal
        window._visitors = {};
        data.visitors.forEach(v => window._visitors[v.id] = v);
      } catch (e) {
        console.error('Failed to load visitors:', e);
      }
    }

    // --- Show detail modal ---
    function showDetail(id) {
      const v = window._visitors[id];
      if (!v) return;

      const fields = [
        ['Visitor ID', v.visitor_id],
        ['IP Address', v.ip],
        ['Visit Time', v.visited_at],
        ['City', v.city],
        ['Region', v.region],
        ['Country', `${v.country} (${v.country_code})`],
        ['Coordinates', `${v.latitude}, ${v.longitude}`],
        ['Timezone', v.timezone],
        ['ISP', v.isp],
        ['Organization', v.org],
        ['AS Info', v.as_info],
        ['Browser', `${v.browser} ${v.browser_version}`],
        ['OS', `${v.os} ${v.os_version}`],
        ['Device Type', v.device_type],
        ['Device', `${v.device_vendor || ''} ${v.device_model || ''}`],
        ['Screen', `${v.screen_width}×${v.screen_height}`],
        ['Viewport', `${v.viewport_width}×${v.viewport_height}`],
        ['Color Depth', v.color_depth],
        ['Pixel Ratio', v.pixel_ratio],
        ['Language', v.language],
        ['All Languages', v.languages],
        ['Platform', v.platform],
        ['Referrer', v.referrer],
        ['Connection', v.connection_type],
        ['Do Not Track', v.do_not_track],
        ['Cookies Enabled', v.cookie_enabled ? 'Yes' : 'No'],
        ['Touch Support', v.touch_support ? 'Yes' : 'No'],
        ['Touch Points', v.max_touch_points],
        ['CPU Cores', v.hardware_concurrency],
        ['Device Memory', v.device_memory ? `${v.device_memory} GB` : 'N/A'],
        ['Battery', v.battery_level != null ? `${(v.battery_level*100).toFixed(0)}% ${v.battery_charging ? '(Charging)' : ''}` : 'N/A'],
        ['User Agent', v.user_agent],
      ];

      document.getElementById('detailContent').innerHTML = fields.map(([label, value]) => `
        <div class="detail-item">
          <div class="label">${label}</div>
          <div class="value">${value || 'N/A'}</div>
        </div>
      `).join('');

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // --- Delete visitor ---
    async function deleteVisitor(id) {
      if (!confirm('Delete this visitor record?')) return;
      await fetch(`/api/visitors/${id}`, { method: 'DELETE' });
      loadDashboard();
    }

    // --- Search ---
    function searchVisitors() {
      currentSearch = document.getElementById('searchInput').value;
      currentPage = 1;
      loadVisitors();
    }

    // --- Pagination ---
    function changePage(delta) {
      currentPage += delta;
      loadVisitors();
    }

    // --- Format time ---
    function formatTime(t) {
      if (!t) return '?';
      const d = new Date(t + 'Z');
      return d.toLocaleString();
    }

    // --- Load everything ---
    function loadDashboard() {
      loadStats();
      loadVisitors();
    }

    loadDashboard();
    // Auto-refresh every 30 seconds
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
